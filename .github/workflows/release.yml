name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check the tag matches package.json
        run: test "v$(node -p 'require("./package.json").version')" = "$GITHUB_REF_NAME"
      - run: npm run typecheck
      - run: npm run lint
      - run: npm test
      - run: npm run zip
      - name: Take this version's notes from CHANGELOG.md
        run: |
          awk -v v="${GITHUB_REF_NAME#v}" '
            /^## / { on = index($0, "## " v " ") == 1; next }
            on' CHANGELOG.md > notes.md
          test -s notes.md
      - name: Attach the zip to the GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" .output/*-chrome.zip --title "Fulcra $GITHUB_REF_NAME" --notes-file notes.md --verify-tag
