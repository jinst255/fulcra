    <title>Banana bread recipe</title>
  </head>
  <body>
    <article>
      <h1>Banana bread</h1>
      <p>
        Mash three bananas, mix with flour, sugar, and butter, then bake for an hour. It keeps for days and
        freezes well. Serve warm with butter or toasted the next morning. Ripe bananas give the best flavor,
        so wait until the peel is spotted brown.
      </p>
    </article>
